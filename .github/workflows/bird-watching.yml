name: Bird watching CI

# bird-watching/ is a separate app with its own lockfile; the weather dashboard's CI ignores it
# (see the root tsconfig/eslint/vitest excludes) and this workflow only runs when it changes.
on:
  pull_request:
    branches: [main]
    paths: ['bird-watching/**', '.github/workflows/bird-watching.yml']
  push:
    branches: [main]
    paths: ['bird-watching/**', '.github/workflows/bird-watching.yml']

concurrency:
  group: bird-watching-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: bird-watching

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bird-watching/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --omit=dev for the same reason as the weather dashboard's CI: GHSA-vfj7-8cjw-p6xm covers
      # every version of `braces`, reachable only through the lint toolchain. Restore the full
      # audit in both workflows once it is patched.
      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-bird-${{ runner.os }}-${{ hashFiles('bird-watching/package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Runs against the production build (see playwright.config.ts).
      - name: End-to-end and accessibility tests
        run: npm run test:e2e
        env:
          CI: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bird-watching-playwright-report
          path: bird-watching/playwright-report/
          retention-days: 7
