name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer commit on the same branch makes an in-flight run obsolete; cancel it rather than paying
# for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # The browser binary is large and changes only with the Playwright version, so it is cached
      # rather than re-downloaded on every run.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Always run, even on a cache hit: --with-deps also installs Chromium's system libraries,
      # which live outside the cached directory. Playwright skips re-downloading the binary itself
      # when the cache restored it.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Runs against the production build (see playwright.config.ts), not the dev server.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
