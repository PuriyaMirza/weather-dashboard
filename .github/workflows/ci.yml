name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer commit on the same branch makes an in-flight run obsolete; cancel it rather than paying
# for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Advisories are published on their own schedule, against packages we don't control, so this
      # blocks on high and critical only. Moderate and low are reported and let through — a gate
      # that stops work over noise gets switched off, which is worse than no gate. Added after two
      # high-severity advisories accumulated unnoticed between rounds of work.
      - name: Security audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # The browser binary is large and changes only with the Playwright version, so it is cached
      # rather than re-downloaded on every run.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Always run, even on a cache hit: --with-deps also installs Chromium's system libraries,
      # which live outside the cached directory. Playwright skips re-downloading the binary itself
      # when the cache restored it.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Runs against the production build (see playwright.config.ts), not the dev server.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Runs alongside build-and-test rather than after it, so the extra signal costs almost no
  # wall-clock. These are the checks unit tests structurally cannot make: that the page is really
  # styled, really hydrates, and has no serious accessibility violations.
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Against the production build, on a freshly started server — never a reused one.
      - name: QA smoke and accessibility checks
        run: npx playwright test tests/e2e/qa-smoke.spec.ts tests/e2e/accessibility.spec.ts
        env:
          CI: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: playwright-report/
          retention-days: 7
